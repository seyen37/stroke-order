[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-order"
version = "0.14.284"
description = "中文字元 → 向量筆跡轉換器（給寫字機器人用）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "seyen37", email = "seyen37@gmail.com"},
]
dependencies = [
    "requests>=2.28",
    "numpy>=1.24",
    "svgpathtools>=1.6",              # KanjiVG path parsing
    "opencc-python-reimplemented>=0.1.7",  # 繁↔簡 variant fallback
    "fonttools>=4.0",                      # Phase 5al: CNS font outline extraction
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.25",                # required by fastapi.testclient for integration tests
    "python-multipart>=0.0.9",    # required for POST file upload (塗鴉模式)
    "Pillow>=10.0",               # 塗鴉 mode: image processing
    "cairosvg>=2.7",              # ODP/GIF/sample rendering
    "scipy>=1.10",                # 立體字卡片 pop-up: 連通元件標記（連筋）
    "shapely>=2.0",               # R1a 骨架長肉字模（字型缺席降級階梯）
]
gif = [
    "cairosvg>=2.7",
    "Pillow>=10.0",
]
# 5ev（W2b）：extras 自引用收斂——web 是唯一實體清單，all/dev 引用它
# （先前四份近乎重複的清單改版本要改多處、CI 用 dev 與 Render 用 web
# 可能漂移）。pip >= 21.2 支援 self-referential extras。
all = [
    "stroke-order[web]",
]
dev = [
    "stroke-order[web]",
    "pytest>=7",
]

[project.scripts]
stroke-order = "stroke_order.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stroke_order.web" = ["static/*", "static/handwriting/*", "static/handwriting/vendor/*", "static/gallery/*"]
"stroke_order.data" = ["*.txt", "sutras/*.md", "sutras/builtin/*.txt"]
"stroke_order.components" = ["data/*.txt", "coversets/*.json"]
"stroke_order.gallery" = ["blocked_words.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
